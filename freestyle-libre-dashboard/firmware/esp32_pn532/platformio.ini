; Leoncito ESP32 + PN532 — plan skeleton (do not build until PN532 is wired)
; Two envs: espidf (primary) and arduino (fallback for Adafruit_PN532)

[env:esp32-s3-amoled-1_8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem101
board_build.flash_mode = qio
board_build.psram_type = opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DCONFIG_SPIRAM_MODE_OCT=1
lib_deps =
  ; IDF components via idf_component.yml: waveshare BSP, esp-nimble/bt

[env:esp32-s3-amoled-1_8-arduino]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem101
board_build.flash_mode = qio
board_build.psram_type = opi
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  adafruit/Adafruit PN532@^1.3.4
  adafruit/Adafruit BusIO@^1.17.0
