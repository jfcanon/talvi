# zizmor configuration.
#
# The one rule relaxed here is `unpinned-uses`. zizmor's blanket default is
# hash-pin everything: `actions/checkout@11bd719...` rather than
# `actions/checkout@v4`. That default is correct — a tag is a moveable
# pointer, so `@v4` means "whatever that org publishes under v4 today",
# and a compromised action repo can retarget it at malicious code without
# any change landing in this repo.
#
# Relaxed to ref-pin for two first-party publishers only:
#   actions/*      — GitHub's own, the same trust root as the runner itself
#   SonarSource/*  — the vendor of the scanner it ships
# Everything else still requires a hash. That is a real narrowing, not a
# blanket opt-out: any third-party action added later fails this audit.
#
# NOT the end state. Hash-pinning these too is strictly better, and Dependabot
# maintains hash pins fine when they carry a `# v4.2.2` trailing comment.
# It is deferred only because the session that wrote this could not resolve
# tag -> commit SHA, and inventing a SHA is worse than an honest ref-pin.
# Follow-up: resolve the three SHAs, pin them, delete this file.
rules:
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        SonarSource/*: ref-pin
        "*": hash-pin
