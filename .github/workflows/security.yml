name: Security scans

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # Filesystem + IaC + secret scan. No account, no server, free.
  #
  # Run through the official image rather than aquasecurity/trivy-action:
  # the action's tag names move around (0.28.0 does not exist), and Docker
  # is already on the runner. `:0.58.0` is pinned deliberately — `:latest`
  # would make this job's result depend on the day it ran.
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan (vuln, secret, misconfig)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.58.0 \
            fs . \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress

  # SonarQube Community runs as an EPHEMERAL service container on the
  # GitHub-hosted runner — zero cost, zero standing infrastructure, works on
  # a private repo (SonarCloud's free tier is public-repos-only). Tradeoff:
  # no history between runs; every analysis is a fresh baseline. The value
  # is the issue report printed into the job summary, not trend tracking.
  sonarqube:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Wait for SonarQube to come up
        run: |
          for i in $(seq 1 60); do
            if curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          echo "SonarQube never reached UP"; exit 1

      # Ephemeral server, default credentials, destroyed with the runner —
      # nothing here is a real secret, but mask the token anyway.
      - name: Generate analysis token
        run: |
          TOKEN=$(curl -s -u admin:admin -X POST \
            "http://localhost:9000/api/user_tokens/generate?name=ci-$GITHUB_RUN_ID" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$TOKEN" ]; then echo "token generation failed"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Analyze
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000
        with:
          args: >
            -Dsonar.projectKey=talvi
            -Dsonar.projectName=talvi
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,dist/**,src/generated/**
            -Dsonar.qualitygate.wait=true

      # The formatter lives in its own file with a QUOTED heredoc delimiter.
      # Inlining it into `python3 -c '...'` inside a YAML block scalar means
      # three nested quoting layers, and the escaped double-quotes silently
      # became a syntax error the first time this ran.
      - name: Publish issue summary
        if: always()
        run: |
          cat > /tmp/fmt.py <<'PYEOF'
          import json, sys
          issues = json.load(sys.stdin).get("issues", [])
          print("## SonarQube issues (ephemeral run — no history)")
          print()
          print("Total: %d" % len(issues))
          print()
          if issues:
              print("| Severity | Rule | File | Line | Message |")
              print("|---|---|---|---|---|")
              for i in issues:
                  comp = i.get("component", "").split(":")[-1]
                  msg = i.get("message", "").replace("|", "/")
                  print("| %s | %s | %s | %s | %s |" % (
                      i.get("severity", ""), i.get("rule", ""),
                      comp, i.get("line", ""), msg))
          PYEOF
          curl -s -u admin:admin \
            "http://localhost:9000/api/issues/search?componentKeys=talvi&ps=500" \
            | python3 /tmp/fmt.py >> "$GITHUB_STEP_SUMMARY"
