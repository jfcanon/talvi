name: Leoncito Glucose Dashboard

# Hourly fetch of Leoncito's glucose readings (LibreLinkUp) + deploy the
# static dashboard to Cloudflare Pages at app.ygdcbtmc4u.uk/leoncito.
#
# The fetch commits updated data/glucose.json back to the repo so history
# accumulates across runs — the 30d/all-time views need the full series, not
# just the last 12h the API returns.
#
# NOTE: the schedule is disabled until the LibreLinkUp + Cloudflare secrets
# exist in this repo (see freestyle-libre-dashboard/README.md). Trigger via
# workflow_dispatch once secrets are added, then uncomment the schedule.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '17 * * * *'   # every hour at :17

permissions:
  contents: write

env:
  LIBRELINK_EMAIL:       ${{ secrets.LIBRELINK_EMAIL }}
  LIBRELINK_PASSWORD:    ${{ secrets.LIBRELINK_PASSWORD }}
  CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freestyle-libre-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch glucose data
        run: python scripts/fetch_glucose.py
      - name: Commit updated data
        run: |
          git config user.name  "leoncito-bot"
          git config user.email "leoncito-bot@users.noreply.github.com"
          git add data/glucose.json
          if git diff --cached --quiet; then
            echo "no data changes; skipping commit"
          else
            git commit -m "chore(data): update Leoncito glucose readings"
            git push
          fi
      - name: Stage data for deploy
        run: mkdir -p site/data && cp data/glucose.json site/data/glucose.json
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy site --project-name leoncito-dashboard
