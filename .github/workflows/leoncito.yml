name: Leoncito Glucose Dashboard

# Deploy the static dashboard to Cloudflare Pages at app.ygdcbtmc4u.uk/leoncito.
# Glucose data fetching is now handled by Cloudflare Worker (leoncito-glucose)
# running on a cron trigger (hourly at :17), storing data in KV, and serving
# via /api/glucose endpoint. The dashboard fetches from this endpoint dynamically.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'freestyle-libre-dashboard/site/**'
      - 'freestyle-libre-dashboard/worker.js'
      - 'freestyle-libre-dashboard/wrangler.toml'
      - 'freestyle-libre-dashboard/main.tf'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freestyle-libre-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy to Cloudflare Pages
        # --branch main pins the production branch so a manual run from a
        # feature branch still publishes to leoncito-dashboard.pages.dev
        # (without it, wrangler uses the current git branch and a non-main
        # run lands as a preview deployment, leaving the production URL 404).
        run: npx --yes wrangler@4 pages deploy site --project-name leoncito-dashboard --branch main

  # Optional: Deploy Worker via wrangler (if not using Terraform)
  # deploy-worker:
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: freestyle-libre-dashboard
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
  #     - run: npx --yes wrangler@4 deploy --env production