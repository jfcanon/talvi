name: Quickmail Worker

# quickmail Worker — inbound email handler via Cloudflare Email Routing catch-all.
# PR → plan (wrangler deploy --dry-run), merge → apply (wrangler deploy).
# Terraform never runs locally.

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'quickmail/**'
      - '.github/workflows/quickmail.yml'
  push:
    branches: [main, master]
    paths:
      - 'quickmail/**'
      - '.github/workflows/quickmail.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID:        ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: oven-sh/setup-bun@c6e2d9d1e3b5b3b5b5b5b5b5b5b5b5b5b5b5b5b5b # v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: quickmail
        run: bun install

      - name: Dry-run deploy (PR)
        if: github.event_name == 'pull_request'
        working-directory: quickmail
        run: bunx wrangler deploy --dry-run

      - name: Deploy (merge to main)
        if: github.event_name == 'push'
        working-directory: quickmail
        run: bunx wrangler deploy