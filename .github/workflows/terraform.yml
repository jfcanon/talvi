name: Terraform

on:
  # Root shared stack (main.tf: zone / DNS / idp). Only run when a root-level
  # .tf changes or this workflow does — subdir stacks own their own workflows.
  pull_request:
    branches: [main, master]
    paths:
      - '*.tf'
      - '*.tfvars'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main, master]
    paths:
      - '*.tf'
      - '*.tfvars'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_talvi_zone_id: ${{ vars.TALVI_ZONE_ID }}
  TF_VAR_whisper_stt_tunnel_secret: ${{ secrets.WHISPER_STT_TUNNEL_SECRET }}
  AWS_ACCESS_KEY_ID:            ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY:        ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - run: npm ci && npm run build       # dist/index.js — main.tf reads it
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform init -input=false
      - run: terraform plan -no-color

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - run: npm ci && npm run build
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform init -input=false
      - run: |
          terraform state rm cloudflare_zero_trust_tunnel_cloudflared.whisper_stt || true
          terraform state rm cloudflare_zero_trust_tunnel_cloudflared_config.whisper_stt || true
          terraform state rm cloudflare_dns_record.whisper_stt || true
      - name: Clean up stale DNS record for stt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ vars.TALVI_ZONE_ID }}
        run: |
          # Delete any existing CNAME record for 'stt' to avoid conflict
          RECORD_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=stt&type=CNAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq -r '.result[0].id // empty')
          if [ -n "$RECORD_ID" ]; then
            echo "Deleting existing DNS record $RECORD_ID"
            curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json"
          else
            echo "No existing DNS record for stt found"
          fi
      - run: terraform apply -auto-approve -no-color
