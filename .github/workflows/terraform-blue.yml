name: Terraform Blue

# Blue release (talvi2.ygdcbtmc4u.uk). Same rules as the green workflow:
# PR → plan, merge → apply. Terraform never runs locally.
# Builds the Next.js app with @opennextjs/cloudflare in blue/ (a Terraform
# input), then plans/applies blue/main.tf against its own state key.

on:
  pull_request: { branches: [main, master] }
  push:         { branches: [main, master] }

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_talvi_zone_id:         ${{ vars.TALVI_ZONE_ID }}
  AWS_ACCESS_KEY_ID:            ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY:        ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - run: npm ci
        working-directory: blue
      - run: npx opennextjs-cloudflare build
        working-directory: blue
      - run: npx wrangler deploy --dry-run --outdir=dist-worker
        working-directory: blue
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform init -input=false
        working-directory: blue
      - run: terraform plan -no-color
        working-directory: blue

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - run: npm ci
        working-directory: blue
      - run: npx opennextjs-cloudflare build
        working-directory: blue
      - run: npx wrangler deploy --dry-run --outdir=dist-worker
        working-directory: blue
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform init -input=false
        working-directory: blue
      - run: terraform apply -auto-approve -no-color
        working-directory: blue
