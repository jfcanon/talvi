name: Terraform Leoncito

# Leoncito dashboard Cloudflare infra (freestyle-libre-dashboard/main.tf):
# Pages project + /leoncito routing. Same rule as every other workflow here:
# PR → plan, merge → apply. Terraform never runs locally. Applies against its
# own state key (talvi/leoncito/terraform.tfstate).

on:
  workflow_dispatch:
  pull_request: { branches: [main, master] }
  push:         { branches: [main, master] }

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_talvi_zone_id:         ${{ vars.TALVI_ZONE_ID }}
  # LibreLinkUp credentials — must match repo secrets added by the owner
  # (TF_VAR_LIBRELINK_EMAIL / TF_VAR_LIBRELINK_PASSWORD). Without these the
  # glucose worker's required vars (main.tf) make `terraform plan` fail.
  TF_VAR_librelink_email:       ${{ secrets.TF_VAR_LIBRELINK_EMAIL }}
  TF_VAR_librelink_password:    ${{ secrets.TF_VAR_LIBRELINK_PASSWORD }}
  # Bearer token for POST /api/ingest (home fetcher). Optional until the owner
  # adds the secret; plan passes without it, but ingest stays disabled.
  TF_VAR_ingest_token:          ${{ secrets.TF_VAR_INGEST_TOKEN }}
  # Clerk JWT verification key for /api/insulin auth (NID-402) — same repo
  # secret every sibling app's workflow already passes to its worker.
  TF_VAR_clerk_jwt_key:         ${{ secrets.CLERK_JWT_KEY }}
  # PUBLIC_MODE: skip Clerk auth for demo/public sharing
  TF_VAR_public_mode:           ${{ vars.PUBLIC_MODE }}
  AWS_ACCESS_KEY_ID:            ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY:        ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform init -input=false
        working-directory: freestyle-libre-dashboard
      - run: terraform plan -no-color
        working-directory: freestyle-libre-dashboard

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform init -input=false
        working-directory: freestyle-libre-dashboard
      - run: terraform apply -auto-approve -no-color
        working-directory: freestyle-libre-dashboard
