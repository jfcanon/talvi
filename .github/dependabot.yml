# Dependabot version updates. Free on every plan, private repos included —
# the dependency graph it needs is also free (it is Dependabot ALERTS on
# org-owned private repos that historically needed GHAS; this is a personal
# account, so both are available).
#
# Note: enabling Dependabot *alerts* is a repo-settings toggle, not something
# this file controls. This file only schedules version-bump PRs.
version: 2

updates:
  # esbuild is pinned EXACT on purpose (build determinism — blueprint Step 2).
  # Dependabot proposing a bump is fine; it arrives as a PR that must pass the
  # no-op-plan determinism check like anything else.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

  # The workflows pin actions by tag; this keeps those tags current.
  # Highest-value ecosystem here — a stale action is the likeliest supply-chain
  # exposure in a repo this small.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: terraform
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
